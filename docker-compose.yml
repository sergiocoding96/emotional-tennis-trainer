version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: tennisaffect-think-aloud-db
    environment:
      POSTGRES_USER: tennisaffect
      POSTGRES_PASSWORD: ${DB_PASSWORD:-devpassword123}
      POSTGRES_DB: tennisaffect_think_aloud
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tennisaffect"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: tennisaffect-think-aloud-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@tennisaffect.local
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    ports:
      - "5051:80"
    depends_on:
      - postgres

volumes:
  postgres_data:
